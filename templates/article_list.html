{% extends "base.html" %}

{% block content %} 

    {% for article in article_list %}

    <h3>{{ article.title }}</h3>
    <p>{{ article.body }}</p>
    <h6>{{ article.author }} | {{ article.date }}</h6>

    <a href="{% url 'article_delete' article.pk %}">Delete</a> |  <a href="{% url 'article_edit' article.pk %}">Edit</a>

    {% endfor %}

{% endblock content %}
